<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fuel Route Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; }
        #form { padding: 10px; display: flex; gap: 8px; align-items: center; }
        #form input { padding: 6px; flex: 1; }
        #form button { padding: 6px 16px; }
        #summary { padding: 0 10px 10px; font-size: 14px; color: #333; }
        #map { height: 85vh; }
        #error { color: #b00020; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="form">
        <input id="start" placeholder="Start (e.g. Chicago, IL)" value="Chicago, IL">
        <input id="finish" placeholder="Finish (e.g. Dallas, TX)" value="Dallas, TX">
        <button id="go">Plan Route</button>
    </div>
    <div id="error"></div>
    <div id="summary"></div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([39.8, -98.6], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);

        let routeLayer = null;

        document.getElementById('go').addEventListener('click', async () => {
            const start = document.getElementById('start').value;
            const finish = document.getElementById('finish').value;
            const errorBox = document.getElementById('error');
            const summaryBox = document.getElementById('summary');
            errorBox.textContent = '';
            summaryBox.textContent = 'Loading...';

            let data;
            try {
                const resp = await fetch('/api/route/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start, finish }),
                });
                data = await resp.json();
                if (!resp.ok) {
                    throw new Error(data.error || JSON.stringify(data));
                }
            } catch (err) {
                summaryBox.textContent = '';
                errorBox.textContent = err.message;
                return;
            }

            if (routeLayer) {
                map.removeLayer(routeLayer);
            }
            routeLayer = L.geoJSON(data.route_geometry).addTo(map);
            map.fitBounds(routeLayer.getBounds());

            data.fuel_stops.forEach((stop) => {
                L.marker([stop.latitude, stop.longitude])
                    .addTo(routeLayer)
                    .bindPopup(
                        `<b>${stop.name}</b><br>${stop.city}, ${stop.state}` +
                        `<br>Mile ${stop.mile_marker} &middot; $${stop.price_per_gallon}/gal` +
                        `<br>${stop.gallons_purchased} gal &middot; $${stop.cost}`
                    );
            });

            summaryBox.textContent =
                `Distance: ${data.total_distance_miles} mi · ` +
                `Fuel stops: ${data.fuel_stops.length} · ` +
                `Total fuel cost: $${data.total_fuel_cost}`;
        });
    </script>
</body>
</html>
